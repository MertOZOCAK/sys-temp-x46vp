<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Z-Pazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ff6000;
            --main-dark: #0f172a;
            --bg-light: #f1f5f9;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 100%);
            color: #475569;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            font-size: 32px;
            font-weight: 800;
            color: var(--main-dark);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .login-logo span {
            color: var(--primary-color);
        }

        .login-subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--main-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--main-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 96, 0, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff6000 0%, #ff8f43 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.3);
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255, 96, 0, 0.4);
            background: linear-gradient(135deg, #ff8f43 0%, #ffaa6b 100%);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 38px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .remember-checkbox {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #fee2e2;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--main-dark);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        /* --- ADMIN GİRİŞ BUTONU --- */
        .admin-login-btn {
            position: fixed;
            right: 24px;
            top: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #ff6000 0%, #ff8f43 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            white-space: nowrap;
            z-index: 100;
        }

        .admin-login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(255, 96, 0, 0.4);
            background: linear-gradient(135deg, #ff8f43 0%, #ffaa6b 100%);
        }

        .admin-login-btn:active {
            transform: translateY(-1px);
        }

        .admin-login-btn i {
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .admin-login-btn {
                right: 16px;
                top: 16px;
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 24px;
        }

        .footer-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: #ff8f43;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px;
            }

            .login-header {
                margin-bottom: 24px;
            }

            .login-logo {
                font-size: 28px;
            }

            .back-btn {
                top: 16px;
                left: 16px;
            }
        }
    </style>
</head>

<body>

    <a href="../manager-login/manager-login.html" class="admin-login-btn" title="Admin Paneli Girişi">
        <i class="bi bi-shield-lock"></i>
        <span>Admin</span>
    </a>

    <a href="../index1.html" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        <span>Geri Dön</span>
    </a>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">Z-<span>Pazar</span></div>
                <div class="login-subtitle">Kullanıcı Girişi</div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Adresi</label>
                    <input type="email" id="email" class="form-control" placeholder="ornek@email.com" required>
                </div>

                <div class="form-group password-group">
                    <label class="form-label" for="password">Şifre</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="passwordToggle" title="Şifreyi Göster/Gizle">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="form-group">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>Beni hatırla</span>
                    </label>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="bi bi-door-open me-2"></i> Giriş Yap
                </button>
            </form>

            <div class="footer-text">
                Hesabınız yok mu? <a href="#">Kayıt Olun</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="login.js"></script>
</body>

</html>
