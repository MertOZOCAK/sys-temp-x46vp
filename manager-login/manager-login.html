<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Pazar | Yönetici Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #4361ee, #3f37c9); }
        body { 
            background: #f0f2f5; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            margin: 0;
        }
        .login-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            background: white;
            width: 90%;
            max-width: 400px;
            margin: auto;
        }
        .login-header {
            background: var(--primary-gradient);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
        }
        .input-group-text {
            background: white;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            border-left: none;
        }
        .password-input { border-right: none; }
        .btn-login {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            color: white;
            transition: 0.3s;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-shield-lock-fill fs-1 mb-2"></i>
        <h4 class="fw-bold">Z-Pazar Admin</h4>
        <p class="mb-0 small opacity-75">Yönetim paneline giriş yapın</p>
    </div>
    
    <div class="card-body p-4">
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">E-posta</label>
                <input type="email" id="email" class="form-control" placeholder="admin@z-pazar.com" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold">Şifre</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control password-input" placeholder="••••••••" required>
                    <span class="input-group-text" id="togglePassword">
                        <i class="bi bi-eye-fill text-muted"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100">Giriş Yap</button>
        </form>
    </div>
</div>

<script type="module" src="auth.js"></script>

</body>
</html>
