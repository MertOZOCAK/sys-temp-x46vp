<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <style>
        :root {
            --primary: #4361ee;
            --bg: #f8f9fd;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        body {
            background: var(--bg) !important;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b2d42;
            overflow-x: hidden;
        }

        /* --- STABİL ANİMASYONLAR (adminuser.html ile tam uyumlu) --- */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: slideUp 0.5s ease-out forwards;
            will-change: transform, opacity;
        }

        /* Çıkış Yap Butonu Özel Tasarımı */
        .btn-logout {
            background: #fff;
            color: #dc3545;
            border: 2px solid #fee2e2;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #dc3545;
            color: #fff;
            transform: translateY(-2px);
        }

        /* İkon Animasyonu */
        .btn-logout i {
            transition: transform 0.4s ease;
        }

        .btn-logout:hover i {
            transform: translateX(3px);
            /* İkon hafifçe sağa kayar */
        }

        /* Tıklama Efekti */
        .btn-logout:active {
            transform: translateY(-1px) scale(0.98);
        }
    </style>
    <div class="container py-4">
        <header class="fade-in d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <h4 class="fw-bold mb-0 text-primary">Z-Pazar Admin</h4>
            <a href="../appmenu.html" class="btn btn-logout shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Geri Dön
            </a>
        </header>

        <div class="card p-4 fade-in"
            style="animation-delay: 0.1s; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid rgba(0, 0, 0, 0.02);">
            <h5>Bakım Modu</h5>
            <div class="form-check form-switch mt-3">
                <input class="form-check-input" type="checkbox" id="maintenanceSwitch"
                    style="cursor: pointer; width: 45px; height: 24px;">
            </div>
        </div>
    </div>
    <script type="module" src="appsetting.js"></script>
</body>

</html>
