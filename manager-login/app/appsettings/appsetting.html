<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Menu</title>
    <link rel="stylesheet" href="appmenu.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <style>
        /* Çıkış Yap Butonu Özel Tasarımı */
        .btn-logout {
            background: #fff;
            color: #dc3545;
            border: 2px solid #fee2e2;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* Üzerine gelince (Hover) Animasyonu */
        .btn-logout:hover {
            background: #dc3545;
            color: #fff;
            border-color: #dc3545;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.2) !important;
        }

        /* İkon Animasyonu */
        .btn-logout i {
            transition: transform 0.4s ease;
        }

        .btn-logout:hover i {
            transform: translateX(3px);
            /* İkon hafifçe sağa kayar */
        }

        /* Tıklama Efekti */
        .btn-logout:active {
            transform: translateY(-1px) scale(0.98);
        }
    </style>
    <div class="container py-4">
        <header class="fade-in d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <h4 class="fw-bold mb-0 text-primary">Z-Pazar Admin</h4>
            <a href="../appmenu.html" class="btn btn-logout shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Geri Dön
            </a>
        </header>

        <div class="card p-4">
            <h5>Bakım Modu</h5>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="maintenanceSwitch">
            </div>
        </div>
    </div>
</body>
