<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HP Top Bar Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4361ee;
            --bg: #f8f9fd;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        body {
            background: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b2d42;
            overflow-x: hidden;
        }

        /* --- STABİL ANİMASYONLAR (adminuser.html ile tam uyumlu) --- */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: slideUp 0.5s ease-out forwards;
            will-change: transform, opacity;
            opacity: 0; /* Başlangıçta görünmez yapıyoruz ki animasyonla gelsin */
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .admin-card {
            background: white;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 12px;
            border: 2px solid #edf2f7;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(67,97,238,0.08);
            border-color: var(--primary);
            outline: none;
        }

        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: 0.2s;
        }
        
        .btn-logout {
            background: #fff;
            color: #dc3545;
            border: 2px solid #fee2e2;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #dc3545;
            color: #fff;
            transform: translateY(-2px);
        }

        .status-badge-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(67, 97, 238, 0.1);
            padding: 5px 15px;
            border-radius: 50px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #4361ee;
            border-radius: 50%;
            position: relative;
        }

        .live-dot::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #4361ee;
            border-radius: 50%;
            animation: live-ping 1.5s infinite;
        }

        @keyframes live-ping {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .spin-animation {
            display: inline-block;
            animation: icon-spin 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes icon-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(180deg); }
        }

        .modern-switch-container {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease;
        }

        .modern-switch-container:has(.form-check-input:checked) {
            background: rgba(67, 97, 238, 0.06);
        }

        .form-check.form-switch {
            padding-left: 0;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check.form-switch .form-check-input {
            width: 45px;
            height: 24px;
            margin-left: 0;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3ccircle cx='10' cy='10' r='7' fill='%2394a3b8'/%3e%3c/svg%3e");
            background-color: #cbd5e1;
            border: none;
            transition: background-position 0.25s ease-in-out, background-color 0.25s ease-in-out, box-shadow 0.15s;
        }

        .form-check.form-switch .form-check-input:checked {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3ccircle cx='10' cy='10' r='7' fill='%23fff'/%3e%3c/svg%3e");
            background-color: var(--primary);
        }

        .form-check.form-switch .form-check-input:focus {
            box-shadow: 0 0 0 4px rgba(67,97,238,0.15);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding: 5px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 5px;
            border-radius: 12px;
            border: 2px solid #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background: #fff;
        }

        .icon-item:hover {
            border-color: var(--primary);
            background: rgba(67, 97, 238, 0.05);
            transform: translateY(-2px);
        }

        .icon-item i {
            font-size: 22px;
            margin-bottom: 4px;
            color: #475569;
        }

        .icon-item span {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        table {
            table-layout: fixed;
            width: 100%;
        }

        th:nth-child(1), td:nth-child(1) { width: 50%; }
        th:nth-child(2), td:nth-child(2) { width: 12%; }
        th:nth-child(3), td:nth-child(3) { width: 13%; }
        th:nth-child(4), td:nth-child(4) { width: 25%; }

        @media (max-width: 768px) {
            table {
                table-layout: auto !important;
            }

            th:nth-child(1), td:nth-child(1),
            th:nth-child(2), td:nth-child(2),
            th:nth-child(3), td:nth-child(3),
            th:nth-child(4), td:nth-child(4) { 
                width: auto !important; 
            }

            td:nth-child(1) {
                white-space: normal !important;
                word-break: break-word !important;
                padding-right: 10px !important;
            }

            .btn-action {
                width: 32px;
                height: 32px;
                border-radius: 8px;
            }

            .btn-action i {
                font-size: 0.85rem;
            }

            .d-flex.justify-content-end.gap-1.gap-md-2 {
                gap: 4px !important;
            }

            .table-responsive {
                overflow-x: hidden !important;
            }

            th, td {
                padding-left: 8px !important;
                padding-right: 8px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="fade-in d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <h4 class="fw-bold mb-0 text-primary">Z-Pazar Admin</h4>
            <a href="../appmenu.html" class="btn btn-logout shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Geri Dön
            </a>
        </header>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card admin-card p-4 sticky-form fade-in" style="animation-delay: 0.1s;">
                    <h5 id="formTitle" class="fw-bold mb-3">Yeni Mesaj Ekle</h5>
                    <form id="topbarForm">
                        <input type="hidden" id="editId">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mesaj Metni</label>
                            <input id="tbMessage" class="form-control" placeholder="Örn: 500 TL ve Üzeri Kargo Bedava!" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">İkon</label>
                            <div class="input-group">
                                <input id="tbIcon" class="form-control" placeholder="bi bi-truck">
                                <button class="btn btn-primary" type="button" id="selectIconBtn" data-bs-toggle="modal" data-bs-target="#iconPickerModal" style="border-top-right-radius: 12px; border-bottom-right-radius: 12px;">
                                    <i class="bi bi-grid-fill me-1"></i> Seç
                                </button>
                            </div>
                        </div>

                        <div class="mb-4 modern-switch-container shadow-sm">
                            <div class="form-check form-switch m-0 w-100 d-flex align-items-center justify-content-between">
                                <label for="tbActive" class="form-check-label fw-bold small text-secondary mb-0">Bu mesaj sitede aktif görünsün</label>
                                <input type="checkbox" id="tbActive" class="form-check-input" checked>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="submitBtn" class="btn btn-primary rounded-pill py-2 fw-bold">Kaydet</button>
                            <button type="button" id="cancelEditBtn" class="btn btn-light rounded-pill py-2 d-none">İptal</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card admin-card border-0 overflow-hidden fade-in" style="animation-delay: 0.2s;">
                    <div class="p-4 border-bottom d-flex justify-content-between align-items-center bg-white">
                        <h6 class="fw-bold mb-0">Kayıtlı Mesajlar</h6>
                        <div class="status-badge-container">
                            <div class="live-dot"></div>
                            <span id="topbarCount" class="fw-bold" style="font-size:0.85rem;">0 Aktif</span>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="bg-light">
                                <tr class="text-muted small">
                                    <th class="ps-4">MESAJ</th>
                                    <th>İKON</th>
                                    <th>DURUM</th>
                                    <th class="text-end pe-4">İŞLEM</th>
                                </tr>
                            </thead>
                            <tbody id="tbList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="iconPickerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" style="border-radius: 20px; border: none;">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="fw-bold">Hazır İkon Listesi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <div class="mb-3">
                        <input type="text" id="iconSearchInput" class="form-control" placeholder="İkon adı arayın... (örn: truck, shop, tag)">
                    </div>
                    <div class="icon-grid" id="iconGridContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="statusMessage" style="position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 16px; border-radius: 8px; color: #fff; display:none; font-weight:700;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="hptopbar.js"></script>
</body>
</html>
