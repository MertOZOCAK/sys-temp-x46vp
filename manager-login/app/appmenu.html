<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Menu</title>
    <link rel="stylesheet" href="appmenu.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <style>
        :root {
            --primary: #4361ee;
            --bg: #f8f9fd;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        body {
            background: var(--bg);
            color: #2b2d42;
            overflow-x: hidden;
        }

        /* --- STABİL ANİMASYONLAR --- */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: slideUp 0.5s ease-out forwards;
            will-change: transform, opacity;
        }

        /* Çıkış Yap Butonu Özel Tasarımı */
        .btn-logout {
            background: #fff;
            color: #dc3545;
            border: 2px solid #fee2e2;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* Üzerine gelince (Hover) Animasyonu */
        .btn-logout:hover {
            background: #dc3545;
            color: #fff;
            border-color: #dc3545;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.2) !important;
        }

        /* İkon Animasyonu */
        .btn-logout i {
            transition: transform 0.4s ease;
        }

        .btn-logout:hover i {
            transform: translateX(3px);
            /* İkon hafifçe sağa kayar */
        }

        /* Tıklama Efekti */
        .btn-logout:active {
            transform: translateY(-1px) scale(0.98);
        }

        .admin-nav {
            background: #ffffff;
            padding: 1.5rem 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        .admin-menu-grid {
            display: grid;
            /* Bu satır butonların hepsinin aynı genişlikte olmasını garantiler */
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .menu-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #f8f9fd;
            border-radius: 12px;
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .menu-link i {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .menu-link:hover {
            transform: translateY(-8px);
            border-color: #4361ee;
            color: #4361ee;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.15);
        }

        .menu-link.active {
            background: #eef2ff;
            color: #4361ee;
            border-color: #c7d2fe;
        }

        /* Mobil uyumluluk: Ekran küçülünce 2'li satırlara düşür */
        @media (max-width: 768px) {
            .admin-menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        
    </style>

    <div class="container py-4">
        <header class="fade-in d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <h4 class="fw-bold mb-0 text-primary">Z-Pazar Admin</h4>
            <button class="btn btn-logout shadow-sm" id="logoutBtn">
                <i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap
            </button>
        </header>

        <nav class="admin-nav">
            <div class="container">
                <div class="admin-menu-grid">
                    <a href="appurun/app.html" class="menu-link">
                        <i class="bi bi-box-seam"></i>
                        <span>Ürünler</span>
                    </a>
                    <a href="#" class="menu-link">
                        <i class="bi bi-cart-check"></i>
                        <span>Siparişler</span>
                    </a>
                    <a href="adminuser/adminuser.html" class="menu-link">
                        <i class="bi bi-people"></i>
                        <span>Yöneticiler</span>
                    </a>
                    <a href="appsettings/appsetting.html" class="menu-link">
                        <i class="bi bi-gear"></i>
                        <span>Ayarlar</span>
                    </a>
                    <a href="appgunnot/appgunnot.html" class="menu-link">
                        <i class="bi bi-journal-text"></i>
                        <span>Güncelleme Notları</span>
                    </a>
                    <a href="#" class="menu-link">
                        <i class="bi bi-slash-circle"></i>
                        <span>Boş</span>
                    </a>
                </div>
            </div>
        </nav>
    </div>
</body>

<script type="module" src="appmenu.js"></script>

</html>
